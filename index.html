<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DALTON GANG | ELITE</title>

<style>
:root {
    --p:#FFD700;
    --bg:#0a0a0a;
}

* {margin:0;padding:0;box-sizing:border-box;}

body {
    font-family:'Cairo',sans-serif;
    background:var(--bg);
    color:#fff;
    overflow-x:hidden;
}

/* خلفية */
.bg {
    position:fixed;
    width:100%;
    height:100%;
    background:radial-gradient(circle at center,#111 0%,#000 80%);
    z-index:-3;
}

/* دخان */
.smoke {
    position:fixed;
    width:200%;
    height:200%;
    background:url('https://i.ibb.co/7QpKsCX/smoke.png');
    opacity:.12;
    animation:move 80s linear infinite;
    z-index:-2;
}
@keyframes move {
    from {transform:translate(0,0);}
    to {transform:translate(-600px,-600px);}
}

/* intro */
#intro {
    position:fixed;
    width:100%;
    height:100%;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:9999;
    transition:1.5s;
}
.intro-title {
    font-size:60px;
    letter-spacing:5px;
    text-shadow:0 0 40px var(--p);
    animation:pulse 2s infinite;
}
@keyframes pulse {
    0%,100%{opacity:1}
    50%{opacity:.6}
}

/* main */
.main {
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding:40px;
    opacity:0;
    transition:1.5s;
}
.show {opacity:1;}

.logo-wrap {
    display:flex;
    gap:60px;
    margin:auto;
}
.logo {
    width:180px;
    border-radius:50%;
    border:4px solid var(--p);
    transition:.4s;
}
.logo:hover {
    transform:scale(1.1);
    box-shadow:0 0 40px var(--p);
}

/* أزرار */
.nav {
    width:100%;
    display:flex;
    justify-content:space-between;
}
.btn {
    padding:15px 40px;
    border-radius:40px;
    border:2px solid var(--p);
    background:transparent;
    color:#fff;
    cursor:pointer;
    transition:.3s;
}
.btn:hover {
    background:var(--p);
    color:#000;
    transform:translateY(-5px);
}

/* صفحات */
.page {
    display:none;
    max-width:1000px;
    margin:auto;
    padding:60px 20px;
    animation:fade .5s;
}
@keyframes fade {
    from{opacity:0;transform:scale(.95)}
    to{opacity:1}
}

/* زر بيت */
.home {
    position:fixed;
    top:20px;
    right:20px;
    width:50px;
    height:50px;
    background:var(--p);
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    box-shadow:0 0 20px var(--p);
}

/* كروت */
.card {
    background:rgba(255,255,255,.05);
    padding:20px;
    border-radius:15px;
    text-align:center;
    margin:10px;
    transition:.3s;
    cursor:pointer;
}
.card:hover {
    transform:translateY(-10px);
    box-shadow:0 0 25px var(--p);
}

.grid {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.badge {
    background:var(--p);
    color:#000;
    padding:5px 10px;
    border-radius:5px;
    font-size:12px;
}

/* قوانين */
.rule {
    background:rgba(255,215,0,.1);
    padding:15px;
    margin:10px 0;
    border-right:5px solid var(--p);
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="smoke"></div>

<div id="intro" onclick="enter()">
<h1 class="intro-title">DALTON</h1>
<p>اضغط للدخول</p>
</div>

<div id="home" class="main">
<h2>THE ROYAL CLAN</h2>

<div class="logo-wrap">
<img src="dalton_logo.png" class="logo">
<img src="server_logo.png" class="logo">
</div>

<div class="nav">
<button class="btn" onclick="go('rules')">القوانين</button>
<button class="btn" onclick="go('staff')">المسؤولين</button>
</div>
</div>

<!-- قوانين -->
<div id="rules" class="page">
<div class="home" onclick="go('home')">🏠</div>
<h1>القوانين</h1>
<div id="rulesList"></div>
</div>

<!-- مسؤولين -->
<div id="staff" class="page">
<div class="home" onclick="go('home')">🏠</div>

<h1 style="text-align:center">الهرم القيادي</h1>

<div class="card" onclick="openD('https://discord.com/users/ID')" style="border:2px solid gold;">
<span class="badge">BOSS</span>
<h2>_l3ep</h2>
</div>

<div class="card" onclick="openD('https://discord.com/users/ID')">
<span class="badge">CO-BOSS</span>
<h3>pqfy9</h3>
</div>

<div class="grid">
<div class="card" onclick="openD('https://discord.com/users/ID')">
<span class="badge">MANAGER</span>
<h3>asd702</h3>
</div>

<div class="card" onclick="openD('https://discord.com/users/ID')">
<span class="badge">CO-MANAGER</span>
<h3>qjizn</h3>
</div>

<div class="card" onclick="openD('https://discord.com/users/ID')">
<span class="badge">CO-MANAGER</span>
<h3>tamim</h3>
</div>
</div>

</div>

<audio id="sfx" src="https://www.soundjay.com/buttons/button-16.mp3"></audio>

<script>
const rules = [
"احترام الجميع",
"ممنوع الخيانة",
"التفاعل إجباري"
];

function enter(){
document.getElementById('sfx').play();
let i=document.getElementById('intro');
i.style.opacity=0;
setTimeout(()=>{
i.style.display='none';
document.getElementById('home').classList.add('show');
},800);
}

function go(p){
document.getElementById('sfx').play();
document.querySelectorAll('.page,.main').forEach(e=>e.style.display='none');

if(p==='home'){
let h=document.getElementById('home');
h.style.display='flex';
setTimeout(()=>h.classList.add('show'),50);
}else{
document.getElementById(p).style.display='block';
if(p==='rules') loadRules();
}
}

function loadRules(){
let box=document.getElementById('rulesList');
box.innerHTML="";
rules.forEach((r,i)=>{
box.innerHTML+=`<div class="rule">${i+1}- ${r}</div>`;
});
}

function openD(url){
window.open(url,'_blank');
}
</script>

</body>
</html>
